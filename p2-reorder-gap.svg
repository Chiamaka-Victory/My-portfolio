<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Histogram comparing median reorder gap of 19 days against skewed mean of 31 days">
  <rect width="720" height="420" fill="#f7f5f0"/>
  <rect x="24" y="24" width="672" height="372" rx="10" fill="#ffffff" stroke="#e7e4dc"/>
  <text x="48" y="62" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#0f172a">Time Between Repeat Purchases (Days)</text>
  <text x="48" y="84" font-family="sans-serif" font-size="12" fill="#475569">Right skewed distribution showing why the median (19 days) beats the mean (31 days)</text>

  <line x1="60" y1="300" x2="660" y2="300" stroke="#e7e4dc" stroke-width="1.5"/>
  <rect x="80" y="190" width="54" height="110" rx="3" fill="#cbd5e1"/>
  <rect x="144" y="130" width="54" height="170" rx="3" fill="#0b2a4a"/>
  <rect x="208" y="114" width="54" height="186" rx="3" fill="#0b2a4a"/>
  <rect x="272" y="168" width="54" height="132" rx="3" fill="#64748b"/>
  <rect x="336" y="220" width="54" height="80" rx="3" fill="#94a3b8"/>
  <rect x="400" y="250" width="54" height="50" rx="3" fill="#cbd5e1"/>
  <rect x="464" y="268" width="54" height="32" rx="3" fill="#cbd5e1"/>
  <rect x="528" y="276" width="54" height="24" rx="3" fill="#cbd5e1"/>
  <rect x="592" y="282" width="54" height="18" rx="3" fill="#cbd5e1"/>

  <!-- Median marker -->
  <line x1="235" y1="102" x2="235" y2="300" stroke="#0b2a4a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="235" y="96" font-family="sans-serif" font-size="11" font-weight="700" fill="#0b2a4a" text-anchor="middle">Median: 19 days</text>

  <!-- Mean marker -->
  <line x1="363" y1="148" x2="363" y2="300" stroke="#b08d57" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="363" y="140" font-family="sans-serif" font-size="11" font-weight="700" fill="#8b6b3b" text-anchor="middle">Mean: 31 days</text>

  <text x="107" y="322" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">7d</text>
  <text x="171" y="322" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">14d</text>
  <text x="235" y="322" font-family="sans-serif" font-size="11" font-weight="700" fill="#0b2a4a" text-anchor="middle">21d</text>
  <text x="299" y="322" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">28d</text>
  <text x="363" y="322" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">35d</text>
  <text x="427" y="322" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">45d</text>
  <text x="491" y="322" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">60d</text>
  <text x="555" y="322" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">75d</text>
  <text x="619" y="322" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">90d+</text>

  <text x="48" y="366" font-family="sans-serif" font-size="12" fill="#475569">Long dormant gaps pull the average up, so 19 days reflects true typical reorder timing</text>
</svg>
