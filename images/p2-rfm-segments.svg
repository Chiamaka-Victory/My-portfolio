<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Customer segmentation scatter chart showing four RFM buyer groups">
  <rect width="720" height="420" fill="#f7f5f0"/>
  <rect x="24" y="24" width="672" height="372" rx="10" fill="#ffffff" stroke="#e7e4dc"/>
  <text x="48" y="62" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#0f172a">Customer Segments by Recency and Frequency</text>
  <text x="48" y="84" font-family="sans-serif" font-size="12" fill="#475569">Four behavioural groups derived from Python RFM scoring</text>

  <line x1="72" y1="115" x2="72" y2="320" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="72" y1="320" x2="648" y2="320" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Loyal Champions -->
  <circle cx="515" cy="146" r="10" fill="#0b2a4a"/>
  <circle cx="545" cy="134" r="9" fill="#0b2a4a"/>
  <circle cx="572" cy="158" r="11" fill="#0b2a4a"/>
  <circle cx="496" cy="168" r="8" fill="#0b2a4a"/>
  <text x="536" y="192" font-family="sans-serif" font-size="12" font-weight="700" fill="#0b2a4a" text-anchor="middle">Loyal Customers (22%)</text>

  <!-- Promising Repeat -->
  <circle cx="355" cy="202" r="8" fill="#475569"/>
  <circle cx="385" cy="190" r="9" fill="#475569"/>
  <circle cx="408" cy="214" r="7" fill="#475569"/>
  <text x="382" y="240" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Regular Buyers (34%)</text>

  <!-- At Risk -->
  <circle cx="220" cy="166" r="9" fill="#b08d57"/>
  <circle cx="246" cy="182" r="8" fill="#b08d57"/>
  <circle cx="198" cy="186" r="7" fill="#b08d57"/>
  <text x="222" y="210" font-family="sans-serif" font-size="12" font-weight="700" fill="#8b6b3b" text-anchor="middle">At Risk Group (18%)</text>

  <!-- Occasional / Dormant -->
  <circle cx="140" cy="278" r="7" fill="#94a3b8"/>
  <circle cx="170" cy="288" r="6" fill="#94a3b8"/>
  <circle cx="195" cy="272" r="7" fill="#94a3b8"/>
  <text x="168" y="308" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">Occasional Buyers (26%)</text>

  <text x="360" y="362" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">More recent purchase and higher order count move customers toward the upper right</text>
</svg>
