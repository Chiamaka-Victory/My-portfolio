<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Horizontal bar chart comparing top selling and lowest selling retail product lines">
  <rect width="720" height="420" fill="#f7f5f0"/>
  <rect x="24" y="24" width="672" height="372" rx="10" fill="#ffffff" stroke="#e7e4dc"/>
  <text x="48" y="62" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#0f172a">Product Category Share of Total Revenue</text>
  <text x="48" y="84" font-family="sans-serif" font-size="12" fill="#475569">Comparison of highest moving lines against slow moving stock</text>

  <text x="48" y="130" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Staple Pantry Goods</text>
  <rect x="220" y="114" width="380" height="22" rx="4" fill="#0b2a4a"/>
  <text x="612" y="130" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">38%</text>

  <text x="48" y="176" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Beverages and Dairy</text>
  <rect x="220" y="160" width="260" height="22" rx="4" fill="#0b2a4a"/>
  <text x="492" y="176" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">26%</text>

  <text x="48" y="222" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Household Cleaning</text>
  <rect x="220" y="206" width="190" height="22" rx="4" fill="#475569"/>
  <text x="422" y="222" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">19%</text>

  <text x="48" y="268" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Personal Care Items</text>
  <rect x="220" y="252" width="120" height="22" rx="4" fill="#94a3b8"/>
  <text x="352" y="268" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">12%</text>

  <text x="48" y="314" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Specialty Gift Packs</text>
  <rect x="220" y="298" width="50" height="22" rx="4" fill="#b08d57"/>
  <text x="282" y="314" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">5%</text>

  <text x="48" y="366" font-family="sans-serif" font-size="12" fill="#475569">Top two categories generated 64% of sales while tying up fewer shelf days</text>
</svg>
